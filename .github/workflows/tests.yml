name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_TAG: saas-billing-metering/app:dev

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the runner user
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_UID=${{ env.APP_UID }}
            APP_GID=${{ env.APP_GID }}

      - name: Prepare the environment file
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          echo "APP_UID=$(id -u)" >> .env
          echo "APP_GID=$(id -g)" >> .env

      - name: Start services
        run: docker compose up -d mysql redis

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 --silent && break
            sleep 2
          done

      - name: Run migrations
        run: docker compose run --rm -T app php artisan migrate --force

      - name: Run backend tests
        run: docker compose run --rm -T app php artisan test

      - name: Stop services
        if: always()
        run: docker compose down

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the runner user
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_UID=${{ env.APP_UID }}
            APP_GID=${{ env.APP_GID }}

      - name: Prepare the environment file
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          echo "APP_UID=$(id -u)" >> .env
          echo "APP_GID=$(id -g)" >> .env

      - name: Run frontend tests
        run: docker compose run --rm -T app npm run test
